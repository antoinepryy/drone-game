services:
  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - admin
    networks:
      - webnet

  web:
    image: nginx:1.27-alpine
    deploy:
      replicas: 3
    volumes:
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - webnet

  admin:
    image: python:3.13-alpine
    command: ["python", "-u", "/app/app.py"]
    volumes:
      - ./admin:/app:ro
    networks:
      - webnet

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - webnet

networks:
  webnet:

volumes:
  db_data:
