# Docker's embedded DNS: re-resolve service names so every replica (and later scale changes) is picked up.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream frontend {
    zone frontend 64k;
    server web:80 resolve;
}

upstream admin {
    zone admin 64k;
    server admin:8000 resolve;
}

server {
    listen 80;

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://admin/;
    }

    location / {
        proxy_pass http://frontend;
        add_header X-Upstream $upstream_addr always;
    }
}
