<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Drone Pilot - admin</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 3rem auto; padding: 0 1rem; color: #1d1d1f; }
    h1 { margin-bottom: .2rem; }
    .meta { color: #666; margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 1rem; }
    .card h2 { font-size: 1.05rem; margin: 0 0 .5rem; display: flex; align-items: center; gap: .5rem; }
    .dot { width: .7rem; height: .7rem; border-radius: 50%; background: #2a9d4b; }
    .down .dot { background: #d62828; }
    .down { border-color: #d62828; }
    dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: .2rem .8rem; font-size: .9rem; }
    dt { color: #666; }
    .empty { color: #d62828; }
  </style>
</head>
<body>
  <h1>Replicas actifs</h1>
  <p class="meta"><span id="count">-</span> replica(s) du service <code>web</code> - mis a jour <span id="when">-</span></p>
  <div class="grid" id="grid"></div>
  <script>
    const grid = document.getElementById("grid");
    async function refresh() {
      try {
        const res = await fetch("api/replicas", { cache: "no-store" });
        const data = await res.json();
        const healthy = data.replicas.filter(r => r.healthy).length;
        document.getElementById("count").textContent = `${healthy}/${data.replicas.length}`;
        document.getElementById("when").textContent = new Date(data.checked_at * 1000).toLocaleTimeString("fr-FR");
        grid.innerHTML = data.replicas.length ? "" : '<p class="empty">Aucun replica trouve.</p>';
        for (const r of data.replicas) {
          const card = document.createElement("div");
          card.className = "card" + (r.healthy ? "" : " down");
          card.innerHTML = `<h2><span class="dot"></span>${r.name}</h2>
            <dl><dt>IP</dt><dd>${r.ip}</dd>
            <dt>HTTP</dt><dd>${r.status ?? "injoignable"}</dd>
            <dt>Latence</dt><dd>${r.latency_ms} ms</dd></dl>`;
          grid.appendChild(card);
        }
      } catch (e) {
        grid.innerHTML = '<p class="empty">API admin injoignable.</p>';
      }
    }
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
